name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

      - name: Require the gate-level suite
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          # Must run and pass on the netlist: everything whose property is a
          # property of the manufactured logic.
          required = {
              "test_reset",
              "test_frontend_bit_exact",
              "test_detector_matches_model",
              "test_mic_clock_period",
              "test_debug_pin_mapping",
              "test_real_fire_drives_detection_outputs",
              "test_hold_duration",
              "test_trim_raises_threshold",
              "test_threshold_trim_arithmetic",
              "test_unused_inputs_ignored",
          }
          # Registered but skipped here on purpose: GATE_BUDGET_SKIP in
          # test/test.py. Reset and stimulus handling is layout-independent and
          # both RTL passes prove it, and these four cost ~22 of ~58 gate
          # frames, which is what pushed this job past the 6 h limit. They must
          # still be *present* in the report, so deleting one is still caught.
          budget_skipped = {
              "test_reset_clears_led",
              "test_dc_input_bit_exact",
              "test_reset_mid_frame_recovers",
              "test_band_dynamic_range",
          }
          expected = required | budget_skipped
          root = ET.parse("test/results.xml").getroot()
          cases = {case.attrib["name"]: case for case in root.iter("testcase")}
          missing = expected - cases.keys()
          unexpected = cases.keys() - expected
          skipped = {
              name for name in cases
              if cases[name].find("skipped") is not None
          }
          failed = {
              name for name in cases
              if any(cases[name].find(tag) is not None for tag in ("failure", "error"))
          }
          # A required test that quietly turned into a skip is a regression;
          # a budget-skipped test that ran anyway is fine, it only costs time.
          required_skipped = required & skipped
          if missing or unexpected or required_skipped or failed:
              raise SystemExit(
                  f"missing: {sorted(missing)}; unexpected: {sorted(unexpected)}; "
                  f"required but skipped: {sorted(required_skipped)}; "
                  f"failed/error: {sorted(failed)}"
              )
          print(f"verified {len(required)} gate-level tests passed; "
                f"{len(skipped & budget_skipped)} skipped for the time budget")
          PY

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      actions: write # to delete this run's stale github-pages artifacts (below)
    steps:
      # actions/deploy-pages, inside the viewer action, resolves the artifact by
      # name within the run. Artifacts survive across re-run attempts, so every
      # re-run of this job leaves another "github-pages" behind and the deploy
      # fails as ambiguous ("Multiple artifacts named github-pages"). Re-running
      # then never recovers, because each attempt adds one more. Drop whatever
      # earlier attempts left before this attempt uploads its own.
      - name: Drop github-pages artifacts left by earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100 },
            );
            // Name-exact on purpose: this run also holds test-results-* and the
            // GDS outputs, and those must survive.
            const stale = artifacts.filter(a => a.name === 'github-pages');
            for (const a of stale) {
              core.info(`deleting stale artifact ${a.id} (${a.name})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: a.id,
              });
            }
            core.info(`removed ${stale.length} stale github-pages artifact(s)`);

      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
