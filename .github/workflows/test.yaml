name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 8: short frames, fast equivalence check.
        # 16: the frame length that is actually hardened.
        frame_log2: [8, 16]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests (FRAME_LOG2=${{ matrix.frame_log2 }})
        run: |
          cd test
          make clean
          FRAME_LOG2=${{ matrix.frame_log2 }} make
          # cocotb 1.x can let make return success after a failed testcase. Parse
          # JUnit structurally, and name the new regression tests explicitly so a
          # decorator or discovery regression cannot silently skip them in CI.
          python - <<'PY'
          import xml.etree.ElementTree as ET

          required = {
              "test_debug_pin_mapping",
              "test_real_fire_drives_detection_outputs",
          }
          root = ET.parse("results.xml").getroot()
          cases = {case.attrib["name"]: case for case in root.iter("testcase")}
          missing = required - cases.keys()
          failed = {
              name for name, case in cases.items()
              if any(case.find(tag) is not None for tag in ("failure", "error"))
          }
          skipped_required = {
              name for name in required & cases.keys()
              if cases[name].find("skipped") is not None
          }
          if missing or failed or skipped_required:
              raise SystemExit(
                  f"missing: {sorted(missing)}; failed/error: {sorted(failed)}; "
                  f"required but skipped: {sorted(skipped_required)}"
              )
          print(f"verified required tests passed; JUnit contains {len(cases)} testcases")
          PY

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-frame${{ matrix.frame_log2 }}
          path: |
            test/results.xml
            test/tb.fst
